name: Keep Render Backend Alive

on:
  schedule:
    # Run every 14 minutes to prevent Render's 15-minute inactivity shutdown
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -s https://gcc-backend-api.onrender.com/ > /dev/null
